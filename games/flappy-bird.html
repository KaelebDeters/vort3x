<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Flappy Bird</title>


<style>

html,
body {

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#000;

}


body {

    display:flex;

    align-items:center;

    justify-content:center;

}


canvas {

    display:block;

    background:
        linear-gradient(
            #4ec0ca,
            #a7e0e6
        );

    touch-action:none;

}

</style>

</head>


<body>


<canvas
    id="game"
    width="400"
    height="600"
>
</canvas>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let bird;

let pipes;

let score;

let best = 0;

let state;

let frame;


const gravity = .45;

const flapPower = -8;

const pipeGap = 165;

const pipeWidth = 62;

const groundHeight = 80;


function reset() {

    bird = {

        x:90,

        y:260,

        velocity:0,

        radius:16

    };


    pipes = [];

    score = 0;

    frame = 0;

    state = "ready";


    spawnPipe(500);

}


function spawnPipe(x) {

    const top =

        60 +

        Math.random()

        *

        (

            600

            -

            groundHeight

            -

            pipeGap

            -

            120

        );


    pipes.push({

        x:x,

        top:top,

        passed:false

    });

}


function flap() {

    if (state === "ready") {

        state = "playing";

    }


    if (state === "playing") {

        bird.velocity =
            flapPower;

    }


    if (state === "over") {

        reset();

    }

}


document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
            ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            flap();

        }

    }
);


canvas.addEventListener(
    "mousedown",
    flap
);


function update() {

    frame++;


    if (state !== "playing") {
        return;
    }


    bird.velocity += gravity;

    bird.y += bird.velocity;


    for (const pipe of pipes) {

        pipe.x -= 2.6;

    }


    if (
        pipes.length
        &&
        pipes[pipes.length - 1].x
        <
        500 - 220
    ) {

        spawnPipe(500);

    }


    pipes =
        pipes.filter(
            pipe =>
                pipe.x > -pipeWidth
        );


    for (const pipe of pipes) {

        if (
            !pipe.passed
            &&
            pipe.x + pipeWidth
            <
            bird.x
        ) {

            pipe.passed = true;

            score++;

            best =
                Math.max(
                    best,
                    score
                );

        }


        const hitX =

            bird.x + bird.radius
            >
            pipe.x

            &&

            bird.x - bird.radius
            <
            pipe.x + pipeWidth;


        const hitY =

            bird.y - bird.radius
            <
            pipe.top

            ||

            bird.y + bird.radius
            >
            pipe.top + pipeGap;


        if (hitX && hitY) {

            state = "over";

        }

    }


    if (
        bird.y + bird.radius
        >
        600 - groundHeight
    ) {

        state = "over";

    }


    if (
        bird.y - bird.radius
        <
        0
    ) {

        bird.y =
            bird.radius;

        bird.velocity = 0;

    }

}


function draw() {

    ctx.clearRect(
        0,
        0,
        400,
        600
    );


    for (const pipe of pipes) {

        ctx.fillStyle =
            "#5ec637";


        ctx.fillRect(
            pipe.x,
            0,
            pipeWidth,
            pipe.top
        );


        ctx.fillRect(
            pipe.x,
            pipe.top + pipeGap,
            pipeWidth,
            600 -
            groundHeight -
            pipe.top -
            pipeGap
        );

    }


    ctx.fillStyle =
        "#ded895";


    ctx.fillRect(
        0,
        600 - groundHeight,
        400,
        groundHeight
    );


    ctx.fillStyle =
        "#f7d51d";


    ctx.beginPath();


    ctx.arc(
        bird.x,
        bird.y,
        bird.radius,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#fff";


    ctx.beginPath();


    ctx.arc(
        bird.x + 6,
        bird.y - 5,
        5,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#000";


    ctx.beginPath();


    ctx.arc(
        bird.x + 8,
        bird.y - 5,
        2,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 36px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        score,
        200,
        70
    );


    if (state === "ready") {

        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "PRESS SPACE TO FLY",
            200,
            300
        );

    }


    if (state === "over") {

        ctx.font =
            "bold 30px Arial";


        ctx.fillText(
            "GAME OVER",
            200,
            260
        );


        ctx.font =
            "18px Arial";


        ctx.fillText(
            "SPACE TO RETRY",
            200,
            300
        );

    }

}


function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}


reset();

loop();

</script>

</body>

</html>
