<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Ragdoll Archers</title>


<style>

html,
body {

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#111827;

}


body {

    display:flex;

    align-items:center;

    justify-content:center;

}


canvas {

    width:100vw;

    height:100vh;

    object-fit:contain;

    background:
        linear-gradient(
            #87b6d6,
            #cfe6ef
        );

    touch-action:none;

}

</style>

</head>


<body>


<canvas
    id="game"
    width="800"
    height="450"
>
</canvas>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const gravity = .35;

const ground = 400;


let players;

let turn;

let arrow;

let aiming;

let aimStart;

let lastMouse;

let winner;


function makePlayer(
    x,
    color,
    facing
) {

    return {

        x:x,

        y:ground,

        color:color,

        facing:facing,

        hp:100,

        ragdoll:null

    };

}


function reset() {

    players = [

        makePlayer(
            120,
            "#e6533c",
            1
        ),

        makePlayer(
            680,
            "#3c7ae6",
            -1
        )

    ];


    turn = 0;

    arrow = null;

    aiming = false;

    winner = null;

}


function mousePosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX
                -
                rect.left
            )
            *
            800
            /
            rect.width,


        y:
            (
                event.clientY
                -
                rect.top
            )
            *
            450
            /
            rect.height

    };

}


canvas.addEventListener(
    "mousedown",
    event => {

        if (winner) {

            reset();

            return;

        }


        if (arrow) {
            return;
        }


        aiming = true;


        aimStart =
            mousePosition(
                event
            );


        lastMouse =
            aimStart;

    }
);


canvas.addEventListener(
    "mousemove",
    event => {

        if (!aiming) {
            return;
        }


        lastMouse =
            mousePosition(
                event
            );

    }
);


canvas.addEventListener(
    "mouseup",
    event => {

        if (!aiming) {
            return;
        }


        aiming = false;


        const shooter =
            players[turn];


        const current =
            mousePosition(
                event
            );


        const dx =
            aimStart.x
            -
            current.x;


        const dy =
            aimStart.y
            -
            current.y;


        const power =
            Math.min(
                Math.hypot(
                    dx,
                    dy
                ) / 8,
                22
            );


        if (power < 2) {
            return;
        }


        const angle =
            Math.atan2(
                dy,
                dx
            );


        arrow = {

            x:
                shooter.x
                +
                shooter.facing * 22,

            y:
                shooter.y
                -
                60,

            vx:
                Math.cos(angle)
                *
                power,

            vy:
                Math.sin(angle)
                *
                power

        };

    }
);


function update() {

    if (!arrow) {
        return;
    }


    arrow.vy +=
        gravity * .6;


    arrow.x +=
        arrow.vx;


    arrow.y +=
        arrow.vy;


    const target =
        players[1 - turn];


    const dx =
        arrow.x
        -
        target.x;


    const dy =
        arrow.y
        -
        (
            target.y - 55
        );


    if (
        !target.ragdoll
        &&
        Math.hypot(
            dx,
            dy
        ) < 32
    ) {

        target.hp -= 34;


        target.ragdoll = {

            x:target.x,

            y:target.y - 55,

            vx:
                arrow.vx * .5,

            vy:-3

        };


        arrow = null;


        if (target.hp <= 0) {

            winner =
                players[turn];

        }

        else {

            setTimeout(
                () => {

                    target.ragdoll = null;

                    turn =
                        1 - turn;

                },
                700
            );

        }

        return;

    }


    if (
        arrow.y > ground
        ||
        arrow.x < -30
        ||
        arrow.x > 830
    ) {

        arrow = null;

        turn =
            1 - turn;

    }

}


function drawPlayer(player) {

    ctx.strokeStyle =
        player.color;


    ctx.fillStyle =
        player.color;


    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";


    const x =
        player.ragdoll
        ? player.ragdoll.x
        : player.x;


    const y =
        player.ragdoll
        ? player.ragdoll.y
        : player.y;


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x,
        y - 32
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        x,
        y - 44,
        11,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x - 10,
        y + 28
    );


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x + 10,
        y + 28
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(
        x,
        y - 26
    );


    ctx.lineTo(
        x + player.facing * 25,
        y - 26
    );


    ctx.stroke();

}


function draw() {

    ctx.clearRect(
        0,
        0,
        800,
        450
    );


    ctx.fillStyle =
        "#7fae57";


    ctx.fillRect(
        0,
        ground,
        800,
        50
    );


    players.forEach(
        drawPlayer
    );


    if (arrow) {

        ctx.strokeStyle =
            "#3a2a1a";


        ctx.lineWidth = 3;


        ctx.beginPath();


        ctx.moveTo(
            arrow.x - 14,
            arrow.y
        );


        ctx.lineTo(
            arrow.x + 14,
            arrow.y
        );


        ctx.stroke();

    }


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 20px Arial";


    ctx.textAlign =
        "center";


    if (winner) {

        ctx.fillText(
            "WINNER! CLICK TO PLAY AGAIN",
            400,
            60
        );

    }

    else {

        ctx.fillText(

            turn === 0
            ? "RED'S TURN"
            : "BLUE'S TURN",

            400,
            60

        );

    }

}


function loop() {

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


reset();

loop();

</script>

</body>

</html>
