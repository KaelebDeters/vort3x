<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VORT3X — Gaming Platform</title>


<style>

/* ============================================================
   ROOT
   ============================================================ */

:root {

    --bg:#050712;
    --panel:#0b1020;
    --panel2:#11182d;

    --text:#eef4ff;
    --muted:#8e9bb8;

    --cyan:#36e7ff;
    --purple:#9b5cff;
    --pink:#ff4fd8;
    --green:#5cff9d;

    --border:rgba(112,151,255,.18);
}


/* ============================================================
   RESET
   ============================================================ */

* {
    box-sizing:border-box;
}

html,
body {

    margin:0;
    min-height:100%;

}


/* ============================================================
   BODY
   ============================================================ */

body {

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(54,231,255,.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 0%,
            rgba(155,92,255,.16),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #040610,
            #080b18 55%,
            #050711
        );

    color:var(--text);

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    min-height:100vh;
}


/* ============================================================
   GAME MODE
   ============================================================ */

body.game-open {

    overflow:hidden !important;

}

body.game-open header,
body.game-open main,
body.game-open footer {

    display:none !important;

}


/* ============================================================
   HEADER
   ============================================================ */

header {

    position:sticky;
    top:0;

    z-index:20;

    backdrop-filter:blur(18px);

    background:rgba(5,7,18,.78);

    border-bottom:
        1px solid var(--border);

}

.nav {

    max-width:1400px;

    margin:auto;

    padding:18px 24px;

    display:flex;

    gap:24px;

    align-items:center;

}

.logo {

    font-weight:900;

    letter-spacing:2px;

    font-size:20px;

    white-space:nowrap;

}

.logo span {

    color:var(--cyan);

    text-shadow:
        0 0 18px var(--cyan);

}


/* ============================================================
   SEARCH
   ============================================================ */

.search {

    flex:1;

    position:relative;

}

.search input {

    width:100%;

    padding:
        13px
        17px
        13px
        42px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:#0a0f1e;

    color:white;

    outline:none;

    font-size:15px;

}

.search::before {

    content:"⌕";

    position:absolute;

    left:15px;

    top:8px;

    font-size:24px;

    color:var(--muted);

}


/* ============================================================
   BUTTONS
   ============================================================ */

.btn {

    border:
        1px solid
        rgba(54,231,255,.35);

    background:
        rgba(54,231,255,.08);

    color:white;

    padding:
        11px 16px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

}

.btn:hover {

    background:
        rgba(54,231,255,.17);

}


/* ============================================================
   MAIN
   ============================================================ */

main {

    max-width:1400px;

    margin:auto;

    padding:
        34px 24px 70px;

}

.section-head {

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin:
        42px 0 18px;

}

.section-head h2 {

    margin:0;

    font-size:26px;

}

.count {

    color:var(--muted);

    font-size:13px;

}


/* ============================================================
   FILTERS
   ============================================================ */

.filters {

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:20px;

}

.filter {

    border:
        1px solid var(--border);

    background:transparent;

    color:var(--muted);

    padding:
        8px 12px;

    border-radius:999px;

    cursor:pointer;

}

.filter.active,
.filter:hover {

    color:white;

    border-color:
        rgba(54,231,255,.45);

    background:
        rgba(54,231,255,.08);

}


/* ============================================================
   GAME GRID
   ============================================================ */

.grid {

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

}


/* ============================================================
   GAME CARD
   ============================================================ */

.card {

    background:

        linear-gradient(
            150deg,
            rgba(17,24,45,.94),
            rgba(8,11,24,.96)
        );

    border:
        1px solid var(--border);

    border-radius:19px;

    overflow:hidden;

    transition:.2s;

    cursor:pointer;

}

.card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(54,231,255,.42);

    box-shadow:

        0 16px 40px
        rgba(0,0,0,.3),

        0 0 25px
        rgba(54,231,255,.07);

}


/* ============================================================
   THUMB
   ============================================================ */

.thumb {

    height:150px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(54,231,255,.18),
            transparent 42%
        ),

        #080c1b;

}


/* ============================================================
   CARD INFO
   ============================================================ */

.info {

    padding:15px;

}

.title {

    font-weight:800;

}

.meta {

    display:flex;

    justify-content:space-between;

    margin-top:9px;

    color:var(--muted);

    font-size:12px;

}

.tag {

    color:var(--cyan);

}


/* ============================================================
   EMPTY
   ============================================================ */

.empty {

    text-align:center;

    color:var(--muted);

    padding:60px;

    display:none;

}


/* ============================================================
   FOOTER
   ============================================================ */

footer {

    text-align:center;

    color:#64718d;

    padding:30px;

    border-top:
        1px solid var(--border);

    font-size:13px;

}


/* ============================================================
   GAME MODAL
   ============================================================ */

.modal {

    position:fixed;

    inset:0;

    background:#000;

    display:none;

    z-index:999999;

    width:100vw;

    height:100vh;

}

.modal.show {

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ============================================================
   GAME BOX
   ============================================================ */

.gamebox {

    width:100vw;

    height:100vh;

    background:#000;

    overflow:hidden;

    display:flex;

    flex-direction:column;

}


/* ============================================================
   GAME BAR
   ============================================================ */

.gamebar {

    display:none;

}


/* ============================================================
   GAME AREA
   ============================================================ */

.gamearea {

    width:100vw;

    height:100vh;

    position:relative;

    overflow:hidden;

    background:#000;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ============================================================
   GAME IFRAME
   ============================================================ */

.gamearea iframe {

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    border:none;

    display:block;

    background:#000;

}


/* ============================================================
   PLAY SCREEN
   ============================================================ */

.play-screen {

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:14px;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(54,231,255,.13),
            transparent 35%
        ),

        #050712;

    text-align:center;

    z-index:10;

}

.play-icon {

    font-size:80px;

    filter:

        drop-shadow(
            0 0 25px
            rgba(54,231,255,.35)
        );

}

.play-screen h2 {

    margin:0;

    font-size:34px;

}

.play-screen p {

    margin:0 0 12px;

    color:var(--muted);

}

.play-screen button {

    border:
        1px solid
        rgba(54,231,255,.55);

    background:
        rgba(54,231,255,.10);

    color:white;

    padding:
        14px 30px;

    border-radius:13px;

    cursor:pointer;

    font-size:16px;

    font-weight:800;

    transition:.2s;

}

.play-screen button:hover {

    background:
        rgba(54,231,255,.20);

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(54,231,255,.12);

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width:1050px) {

    .grid {

        grid-template-columns:
            repeat(3,1fr);

    }

}

@media(max-width:760px) {

    .grid {

        grid-template-columns:
            repeat(2,1fr);

    }

    .nav {

        flex-wrap:wrap;

    }

    .search {

        order:3;

        flex-basis:100%;

    }

}

@media(max-width:480px) {

    .grid {

        grid-template-columns:1fr;

    }

    main {

        padding:
            20px 14px;

    }

}

</style>

</head>


<body>


<!-- ============================================================
     HEADER
     ============================================================ -->

<header>

<div class="nav">

<div class="logo">

VOR<span>T</span>3X

</div>


<div class="search">

<input
    id="search"
    placeholder="Search titles, genres, explore..."
>

</div>


<button
    class="btn"
    onclick="randomGame()"
>

⚡ RANDOM

</button>

</div>

</header>


<!-- ============================================================
     DIRECTORY
     ============================================================ -->

<main>

<div class="section-head">

<h2>
GAMING DIRECTORY
</h2>

<div
    class="count"
    id="count"
></div>

</div>


<div
    class="filters"
    id="filters"
></div>


<div
    class="grid"
    id="grid"
></div>


<div
    class="empty"
    id="empty"
>

No games found.

</div>

</main>


<footer>

VORT3X • Premium Gaming Platform • Curated Games & Experiences

</footer>


<!-- ============================================================
     GAME WINDOW
     ============================================================ -->

<div
    class="modal"
    id="modal"
>

<div class="gamebox">


<div
    class="gamearea"
    id="gamearea"
>

<div class="play-screen">

<div class="play-icon">
🎮
</div>

<h2>
Game Ready
</h2>

<p>
Select a game to begin.
</p>

</div>

</div>

</div>

</div>


<script>


/* ============================================================
   GAMES
   ============================================================ */

const games =
[["Slope", "⚪", "Arcade", "https://y8.com/embed/slope"], ["Flappy Bird", "🐥", "Arcade", "games/flappy-bird.html"], ["Ragdoll Archers", "🏹", "Shooter", "games/ragdoll-archers.html"], ["PolyTrack", "🏎️", "Racing", "https://classroom-6x.io/games/polytrack/"], ["Retro Bowl", "🏈", "Sports", "https://911games.io/retro-bowl"], ["Pixel Soccer", "⚽", "Sports", "#"], ["Rocket League", "🚀", "Sports", "#"], ["Synth Shooter", "🔫", "Shooter", "#"], ["Gravity Flip", "🔄", "Arcade", "#"], ["Star Racer", "🌌", "Racing", "#"], ["Cyber Chess", "♟️", "Strategy", "#"], ["Laser Dash", "⚡", "Arcade", "#"], ["Dungeon Zero", "⚔️", "Adventure", "#"], ["Sky Defender", "🛸", "Shooter", "#"], ["Street Drifter", "🏁", "Racing", "#"], ["Goal Machine", "🥅", "Sports", "#"], ["Code Breaker", "💻", "Puzzle", "#"], ["Neon Golf", "⛳", "Sports", "#"], ["Quantum Jump", "🌀", "Platformer", "#"], ["Astro Miner", "⛏️", "Adventure", "#"], ["Void Survivor", "👾", "Action", "#"], ["Turbo Bike", "🏍️", "Racing", "#"], ["Maze Protocol", "🧩", "Puzzle", "#"], ["Cyber Kart", "🏎️", "Racing", "#"], ["Battle Bots", "⚙️", "Action", "#"]];


let active = "ALL";

let currentGame = null;


/* ============================================================
   FILTERS
   ============================================================ */

function renderFilters() {

    const cats = [

        "ALL",

        ...new Set(
            games.map(
                g => g[2]
            )
        )

    ];


    const filters =
        document.getElementById(
            "filters"
        );


    filters.innerHTML =
        cats.map(
            category => `

                <button
                    class="filter ${
                        category === active
                        ? "active"
                        : ""
                    }"

                    onclick="setCategory('${category}')"
                >

                    ${category}

                </button>

            `
        ).join("");

}


function setCategory(category) {

    active = category;

    renderFilters();

    render();

}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const shown =
        games.filter(
            game =>

                (
                    active === "ALL"

                    ||

                    game[2] === active
                )

                &&

                game[0]
                    .toLowerCase()
                    .includes(search)
        );


    document
        .getElementById("count")
        .textContent =
        `${shown.length} / ${games.length} GAMES`;


    document
        .getElementById("empty")
        .style.display =
        shown.length
        ? "none"
        : "block";


    document
        .getElementById("grid")
        .innerHTML =

        shown.map(

            game => `

                <article
                    class="card"
                    onclick='openGame(${JSON.stringify(game)})'
                >

                    <div class="thumb">

                        ${game[1]}

                    </div>


                    <div class="info">

                        <div class="title">

                            ${game[0]}

                        </div>


                        <div class="meta">

                            <span class="tag">

                                ${game[2]}

                            </span>

                        </div>

                    </div>

                </article>

            `

        ).join("");

}


/* ============================================================
   SHOW PLAY SCREEN
   ============================================================ */

function showPlayScreen() {

    const gamearea =
        document.getElementById(
            "gamearea"
        );


    if (!currentGame) {

        gamearea.innerHTML = `

            <div class="play-screen">

                <div class="play-icon">
                    🎮
                </div>

                <h2>
                    Game Ready
                </h2>

                <p>
                    Select a game to begin.
                </p>

            </div>

        `;

        return;

    }


    gamearea.innerHTML = `

        <div class="play-screen">

            <div class="play-icon">

                ${currentGame[1]}

            </div>


            <h2>

                ${currentGame[0]}

            </h2>


            <p>

                Fullscreen ended.
                Press PLAY to start again.

            </p>


            <button
                onclick="startCurrentGame()"
            >

                ▶ PLAY

            </button>

        </div>

    `;

}


/* ============================================================
   LOAD GAME
   ============================================================ */

function loadCurrentGame() {

    if (!currentGame) {
        return;
    }


    const gamearea =
        document.getElementById(
            "gamearea"
        );


    const url =
        currentGame[3];


    if (!url || url === "#") {

        showPlayScreen();

        return;

    }


    /*
        Completely remove the previous game.

        This guarantees that pressing PLAY after
        exiting fullscreen creates a fresh iframe.
    */

    gamearea.innerHTML = "";


    /*
        Create the iframe using JavaScript.

        This is more reliable than injecting a giant
        iframe string into innerHTML.
    */

    const iframe =
        document.createElement("iframe");


    iframe.src = url;


    iframe.title =
        currentGame[0];


    iframe.setAttribute(
        "allow",
        "fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    );


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    iframe.setAttribute(
        "webkitallowfullscreen",
        ""
    );


    iframe.setAttribute(
        "mozallowfullscreen",
        ""
    );


    iframe.style.position =
        "absolute";


    iframe.style.inset =
        "0";


    iframe.style.width =
        "100%";


    iframe.style.height =
        "100%";


    iframe.style.border =
        "none";


    iframe.style.display =
        "block";


    iframe.style.background =
        "#000";


    gamearea.appendChild(
        iframe
    );

}


/* ============================================================
   START GAME
   ============================================================ */

async function startCurrentGame() {

    if (!currentGame) {
        return;
    }


    loadCurrentGame();


    const modal =
        document.getElementById(
            "modal"
        );


    const gamebox =
        document.querySelector(
            ".gamebox"
        );


    modal.classList.add(
        "show"
    );


    /*
        Give the iframe a moment to be inserted
        before requesting fullscreen.
    */

    try {

        if (!document.fullscreenElement) {

            await gamebox.requestFullscreen();

        }

    }

    catch (error) {

        console.log(
            "Fullscreen unavailable:",
            error
        );

    }

}


/* ============================================================
   OPEN GAME
   ============================================================ */

function openGame(game) {

    currentGame = game;


    /*
        Hide the VORT3X directory.
    */

    document.body.classList.add(
        "game-open"
    );


    /*
        Open the game window.
    */

    document
        .getElementById("modal")
        .classList.add("show");


    /*
        Start immediately.
    */

    startCurrentGame();

}


/* ============================================================
   CLOSE SESSION
   ============================================================ */

function closeGameSession() {

    if (document.fullscreenElement) {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );

    }


    document.body.classList.remove(
        "game-open"
    );


    document
        .getElementById("modal")
        .classList.remove(
            "show"
        );


    document
        .getElementById("gamearea")
        .innerHTML = `

            <div class="play-screen">

                <div class="play-icon">
                    🎮
                </div>

                <h2>
                    Game Ready
                </h2>

                <p>
                    Select a game to begin.
                </p>

            </div>

        `;


    currentGame = null;

}


/* ============================================================
   FULLSCREEN EXIT
   ============================================================ */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (!document.fullscreenElement) {

            if (currentGame) {

                /*
                    Keep the user inside game mode.
                */

                document.body.classList.add(
                    "game-open"
                );


                /*
                    Destroy the old iframe.
                */

                showPlayScreen();

            }

        }

    }
);


/* ============================================================
   ESCAPE KEY
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (event.key !== "Escape") {
            return;
        }


        /*
            If fullscreen is active,
            allow the browser to exit it.

            fullscreenchange() will then
            display the PLAY screen.
        */

        if (document.fullscreenElement) {

            document
                .exitFullscreen()
                .catch(
                    () => {}
                );

            return;

        }


        /*
            If fullscreen has already ended,
            keep the player on the PLAY screen.
        */

        if (currentGame) {

            showPlayScreen();

        }

    }
);


/* ============================================================
   RANDOM GAME
   ============================================================ */

function randomGame() {

    if (!games.length) {
        return;
    }


    const game =
        games[
            Math.floor(
                Math.random()
                *
                games.length
            )
        ];


    openGame(game);

}


/* ============================================================
   SEARCH
   ============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* ============================================================
   START
   ============================================================ */

renderFilters();

render();


</script>

</body>

</html>
