
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VORT3X — Gaming Platform</title>

<style>

:root {
    --bg:#050712;
    --panel:#0b1020;
    --panel2:#11182d;
    --text:#eef4ff;
    --muted:#8e9bb8;
    --cyan:#36e7ff;
    --purple:#9b5cff;
    --pink:#ff4fd8;
    --green:#5cff9d;
    --border:rgba(112,151,255,.18);
}

* {
    box-sizing:border-box;
}

html,
body {
    margin:0;
    min-height:100%;
}

body {

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(54,231,255,.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 0%,
            rgba(155,92,255,.16),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #040610,
            #080b18 55%,
            #050711
        );

    color:var(--text);

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    min-height:100vh;
}

body.game-open {
    overflow:hidden;
}

body.game-open header,
body.game-open main,
body.game-open footer {
    display:none;
}

/* GRID BACKGROUND */

body::before {

    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

/* HEADER */

header {

    position:sticky;
    top:0;
    z-index:20;

    backdrop-filter:blur(18px);

    background:rgba(5,7,18,.78);

    border-bottom:
        1px solid var(--border);
}

.nav {

    max-width:1400px;

    margin:auto;

    padding:18px 24px;

    display:flex;

    gap:24px;

    align-items:center;
}

.logo {

    font-weight:900;

    letter-spacing:2px;

    font-size:20px;

    white-space:nowrap;
}

.logo span {

    color:var(--cyan);

    text-shadow:
        0 0 18px var(--cyan);
}

.search {

    flex:1;

    position:relative;
}

.search input {

    width:100%;

    padding:
        13px
        17px
        13px
        42px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:#0a0f1e;

    color:white;

    outline:none;

    font-size:15px;
}

.search input:focus {

    border-color:
        rgba(54,231,255,.55);

    box-shadow:
        0 0 25px
        rgba(54,231,255,.1);
}

.search::before {

    content:"⌕";

    position:absolute;

    left:15px;

    top:8px;

    font-size:24px;

    color:var(--muted);
}

.btn {

    border:
        1px solid
        rgba(54,231,255,.35);

    background:
        rgba(54,231,255,.08);

    color:white;

    padding:
        11px 16px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

.btn:hover {

    background:
        rgba(54,231,255,.17);

    transform:
        translateY(-1px);
}

/* MAIN */

main {

    max-width:1400px;

    margin:auto;

    padding:
        34px 24px 70px;
}

/* DIRECTORY */

.section-head {

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin:
        42px 0 18px;
}

.section-head h2 {

    margin:0;

    font-size:26px;
}

.count {

    color:var(--muted);

    font-size:13px;
}

/* FILTERS */

.filters {

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.filter {

    border:
        1px solid
        var(--border);

    background:transparent;

    color:var(--muted);

    padding:
        8px 12px;

    border-radius:999px;

    cursor:pointer;
}

.filter.active,
.filter:hover {

    color:white;

    border-color:
        rgba(54,231,255,.45);

    background:
        rgba(54,231,255,.08);
}

/* GAME GRID */

.grid {

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;
}

/* GAME CARD */

.card {

    background:
        linear-gradient(
            150deg,
            rgba(17,24,45,.94),
            rgba(8,11,24,.96)
        );

    border:
        1px solid
        var(--border);

    border-radius:19px;

    overflow:hidden;

    transition:.2s;

    cursor:pointer;

    position:relative;
}

.card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(54,231,255,.42);

    box-shadow:

        0 16px 40px
        rgba(0,0,0,.3),

        0 0 25px
        rgba(54,231,255,.07);
}

/* CARD FULLSCREEN */

.card-fullscreen {

    position:absolute;

    top:8px;
    right:8px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid
        var(--cyan);

    color:var(--cyan);

    border-radius:8px;

    padding:
        6px 8px;

    cursor:pointer;

    font-size:14px;

    display:none;

    z-index:10;
}

.card:hover .card-fullscreen {

    display:block;
}

/* THUMB */

.thumb {

    height:150px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(54,231,255,.18),
            transparent 42%
        ),

        #080c1b;
}

.card:nth-child(3n) .thumb {

    background:

        radial-gradient(
            circle,
            rgba(155,92,255,.2),
            transparent 45%
        ),

        #0b0a1c;
}

.card:nth-child(4n) .thumb {

    background:

        radial-gradient(
            circle,
            rgba(255,79,216,.16),
            transparent 45%
        ),

        #12091a;
}

/* CARD INFO */

.info {

    padding:15px;
}

.title {

    font-weight:800;
}

.meta {

    display:flex;

    justify-content:space-between;

    margin-top:9px;

    color:var(--muted);

    font-size:12px;
}

.tag {

    color:var(--cyan);
}

/* EMPTY */

.empty {

    text-align:center;

    color:var(--muted);

    padding:60px;

    display:none;
}

/* FOOTER */

footer {

    text-align:center;

    color:#64718d;

    padding:30px;

    border-top:
        1px solid
        var(--border);

    font-size:13px;
}

/* ==========================================================
   GAME MODAL
   ========================================================== */

.modal {

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.95);

    backdrop-filter:
        blur(12px);

    display:none;

    z-index:50;

    padding:0;
}

.modal.show {

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        4vh 4vw;
}

/* TRUE FULLSCREEN */

.modal.fullscreen {

    inset:0;

    background:#000;

    padding:0;

    border-radius:0;
}

.modal.fullscreen .gamebox {

    width:100vw;

    height:100vh;

    border-radius:0;

    border:none;

    box-shadow:none;
}

.modal.fullscreen .gamebar {

    display:none;
}

/* GAME BOX */

.gamebox {

    width:
        min(1100px,100%);

    height:
        min(760px,92vh);

    background:#050712;

    border:
        1px solid
        rgba(54,231,255,.3);

    border-radius:22px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    box-shadow:
        0 0 80px
        rgba(54,231,255,.12);
}

/* GAME BAR */

.gamebar {

    padding:
        12px 16px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:
        1px solid
        var(--border);

    background:
        rgba(5,7,18,.95);
}

.gamebar-left {

    font-weight:700;

    color:white;
}

.gamebar-right {

    display:flex;

    gap:8px;

    align-items:center;
}

/* FULLSCREEN BUTTON */

.fullscreen-btn {

    background:
        rgba(54,231,255,.1);

    border:
        1px solid
        rgba(54,231,255,.3);

    color:var(--cyan);

    padding:
        8px 12px;

    border-radius:6px;

    cursor:pointer;

    font-weight:600;

    font-size:13px;
}

/* EXIT */

.exit-btn {

    display:none;

    background:
        rgba(255,79,216,.1);

    border:
        1px solid
        rgba(255,79,216,.3);

    color:#ff4fd8;

    padding:
        8px 12px;

    border-radius:6px;

    cursor:pointer;

    font-weight:600;

    font-size:13px;
}

/* ==========================================================
   GAME AREA
   ========================================================== */

.gamearea {

    flex:1;

    position:relative;

    overflow:hidden;

    background:#000;

    display:flex;
}

/*
   THIS IS THE IMPORTANT PART.

   The iframe fills the entire game area.
*/

.gamearea iframe {

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    border:none;

    display:block;

    background:#000;
}

/*
   If the external page itself has scrollbars,
   hide them from your arcade container.
*/

.gamearea {

    scrollbar-width:none;
}

.gamearea::-webkit-scrollbar {

    display:none;
}

/* DEMO */

.demo {

    text-align:center;

    padding:30px;

    margin:auto;
}

.demo .big {

    font-size:80px;
}

.demo h2 {

    font-size:32px;
}

.demo p {

    color:var(--muted);

    max-width:500px;

    line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:1050px) {

    .grid {

        grid-template-columns:
            repeat(3,1fr);
    }
}

@media(max-width:760px) {

    .grid {

        grid-template-columns:
            repeat(2,1fr);
    }

    .nav {

        flex-wrap:wrap;
    }

    .search {

        order:3;

        flex-basis:100%;
    }
}

@media(max-width:480px) {

    .grid {

        grid-template-columns:1fr;
    }

    main {

        padding:
            20px 14px;
    }
}

</style>

</head>

<body>

<header>

<div class="nav">

<div class="logo">
VOR<span>T</span>3X
</div>

<div class="search">

<input
id="search"
placeholder="Search titles, genres, explore..."
>

</div>

<button
class="btn"
onclick="randomGame()"
>
⚡ RANDOM
</button>

</div>

</header>


<main>

<div class="section-head">

<h2>
GAMING DIRECTORY
</h2>

<div
class="count"
id="count"
>
</div>

</div>


<div
class="filters"
id="filters"
>
</div>


<div
class="grid"
id="grid"
>
</div>


<div
class="empty"
id="empty"
>
No games found. Try another search.
</div>

</main>


<footer>

VORT3X • Premium Gaming Platform • Curated Games & Experiences

</footer>


<!-- GAME WINDOW -->

<div
class="modal"
id="modal"
>

<div class="gamebox">

<div class="gamebar">

<div
class="gamebar-left"
id="modalTitle"
>
GAME
</div>

<div class="gamebar-right">

<button
class="fullscreen-btn"
id="fsBtn"
onclick="toggleTrueFullscreen()"
>
⛶ FULLSCREEN
</button>

<button
class="exit-btn"
onclick="closeGame()"
>
✕ EXIT
</button>

<button
class="btn"
id="closeBtn"
onclick="closeGame()"
>
✕ CLOSE
</button>

</div>

</div>


<div
class="gamearea"
id="gamearea"
>

<div class="demo">

<div
class="big"
id="modalIcon"
>
🎮
</div>

<h2>
Game Ready
</h2>

<p>
Select a game to begin.
</p>

</div>

</div>

</div>

</div>


<script>

/* ============================================================
   GAMES
   ============================================================ */

const games = [["Slope", "⚪", "Arcade", "https://y8.com/embed/slope"], ["Flappy Bird", "🐥", "Arcade", "https://funhtml5games.com?embed=flappy"], ["Ragdoll Archers", "🏹", "Shooter", "https://www.crazygames.com/embed/ragdoll-archers"], ["Mech Arena", "🤖", "Action", "#"], ["Pixel Soccer", "⚽", "Sports", "#"], ["Rocket League", "🚀", "Sports", "#"], ["Synth Shooter", "🔫", "Shooter", "#"], ["Gravity Flip", "🔄", "Arcade", "#"], ["Star Racer", "🌌", "Racing", "#"], ["Cyber Chess", "♟️", "Strategy", "#"], ["Laser Dash", "⚡", "Arcade", "#"], ["Dungeon Zero", "⚔️", "Adventure", "#"], ["Sky Defender", "🛸", "Shooter", "#"], ["Street Drifter", "🏁", "Racing", "#"], ["Goal Machine", "🥅", "Sports", "#"], ["Code Breaker", "💻", "Puzzle", "#"], ["Neon Golf", "⛳", "Sports", "#"], ["Quantum Jump", "🌀", "Platformer", "#"], ["Astro Miner", "⛏️", "Adventure", "#"], ["Void Survivor", "👾", "Action", "#"], ["Turbo Bike", "🏍️", "Racing", "#"], ["Maze Protocol", "🧩", "Puzzle", "#"], ["Cyber Kart", "🏎️", "Racing", "#"], ["Battle Bots", "⚙️", "Action", "#"]];


let active = "ALL";


/* ============================================================
   FILTERS
   ============================================================ */

function renderFilters() {

    const cats = [
        "ALL",
        ...new Set(
            games.map(g => g[2])
        )
    ];

    const f =
        document.getElementById("filters");

    f.innerHTML = cats.map(c => `

        <button
            class="filter ${c === active ? "active" : ""}"
            onclick="setCategory('${c}')"
        >

            ${c}

        </button>

    `).join("");
}


function setCategory(c) {

    active = c;

    renderFilters();

    render();
}


/* ============================================================
   RENDER GAMES
   ============================================================ */

function render() {

    const q =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const shown =
        games.filter(g =>

            (active === "ALL" || g[2] === active)

            &&

            g[0]
            .toLowerCase()
            .includes(q)

        );


    document
        .getElementById("count")
        .textContent =
        `${shown.length} / ${games.length} GAMES`;


    document
        .getElementById("empty")
        .style.display =
        shown.length
        ? "none"
        : "block";


    document
        .getElementById("grid")
        .innerHTML =

        shown.map(g => `

            <article
                class="card"
                onclick='openGame(${JSON.stringify(g)})'
            >

                <div
                    class="card-fullscreen"
                    onclick='event.stopPropagation(); openGameFullscreen(${JSON.stringify(g)})'
                    title="Open Fullscreen"
                >
                    ⛶
                </div>

                <div class="thumb">

                    ${g[1]}

                </div>

                <div class="info">

                    <div class="title">

                        ${g[0]}

                    </div>

                    <div class="meta">

                        <span class="tag">

                            ${g[2]}

                        </span>

                    </div>

                </div>

            </article>

        `).join("");
}


/* ============================================================
   OPEN GAME
   ============================================================ */

function openGame(g, skipFullscreen) {

    document
        .body
        .classList
        .add("game-open");


    document
        .getElementById("modalTitle")
        .textContent =
        g[0].toUpperCase();


    const modalIcon =
        document.getElementById("modalIcon");

    if (modalIcon) {
        modalIcon.textContent = g[1];
    }


    const gamearea =
        document.getElementById("gamearea");


    /*
       IMPORTANT:

       The website URL goes directly into the iframe.

       Your arcade controls the container,
       while the external website controls
       what appears inside the iframe.
    */

    if (g[3] && g[3] !== "#") {

        gamearea.innerHTML = `

            <iframe

                src="${g[3]}"

                title="${g[0]}"

                allow="
                    fullscreen;
                    autoplay;
                    gamepad;
                    clipboard-read;
                    clipboard-write
                "

                allowfullscreen

                webkitallowfullscreen

                mozallowfullscreen

            ></iframe>

        `;

    }

    else {

        gamearea.innerHTML = `

            <div class="demo">

                <div class="big">
                    ${g[1]}
                </div>

                <h2>
                    ${g[0]}
                </h2>

                <p>
                    ${g[2]}.
                    Add the game's URL to make it playable.
                </p>

            </div>

        `;

    }


    document
        .getElementById("modal")
        .classList
        .add("show");


    /*
       By default, every game takes over the
       entire screen immediately -- no modal
       chrome, no header, no footer, just the
       game. Press Escape (or the hidden exit
       button) to get back to the directory.
    */

    if (!skipFullscreen) {

        setTimeout(
            () => {

                if (!document.fullscreenElement) {

                    toggleTrueFullscreen();

                }

            },
            150
        );

    }

}


/* ============================================================
   CLOSE GAME
   ============================================================ */

function closeGame() {

    document
        .body
        .classList
        .remove("game-open");


    document
        .getElementById("modal")
        .classList
        .remove("show");


    document
        .getElementById("modal")
        .classList
        .remove("fullscreen");


    document
        .getElementById("gamearea")
        .innerHTML = `

            <div class="demo">

                <div class="big">
                    🎮
                </div>

                <h2>
                    Game Ready
                </h2>

                <p>
                    Select another game.
                </p>

            </div>

        `;


    document
        .getElementById("fsBtn")
        .textContent =
        "⛶ FULLSCREEN";


    if (document.fullscreenElement) {

        document.exitFullscreen();

    }

}


/* ============================================================
   TRUE FULLSCREEN
   ============================================================ */

function toggleTrueFullscreen() {

    const gamebox =
        document.querySelector(".gamebox");

    const modal =
        document.getElementById("modal");


    if (!document.fullscreenElement) {

        gamebox
            .requestFullscreen()
            .catch(
                e =>
                console.log(
                    "Fullscreen error:",
                    e
                )
            );

        modal
            .classList
            .add("fullscreen");

        document
            .getElementById("fsBtn")
            .textContent =
            "⛶ EXIT FULLSCREEN";

    }

    else {

        document.exitFullscreen();

        modal
            .classList
            .remove("fullscreen");

        document
            .getElementById("fsBtn")
            .textContent =
            "⛶ FULLSCREEN";

    }

}


/* ============================================================
   OPEN GAME FULLSCREEN
   ============================================================ */

function openGameFullscreen(g) {

    /*
       Every game already goes fullscreen by
       default now, so this is just an alias
       kept for the card's fullscreen icon.
    */

    openGame(g);

}


/* ============================================================
   RANDOM GAME
   ============================================================ */

function randomGame() {

    const game =
        games[
            Math.floor(
                Math.random()
                * games.length
            )
        ];

    openGame(game);

}


/* ============================================================
   SEARCH
   ============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    e => {

        if (e.key === "Escape") {

            if (document.fullscreenElement) {

                document.exitFullscreen();

            }

            else if (
                document
                .getElementById("modal")
                .classList
                .contains("show")
            ) {

                closeGame();

            }

        }

    }
);


/* ============================================================
   FULLSCREEN CHANGE
   ============================================================ */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (!document.fullscreenElement) {

            document
                .getElementById("modal")
                .classList
                .remove("fullscreen");

            document
                .getElementById("fsBtn")
                .textContent =
                "⛶ FULLSCREEN";

        }

    }
);


/* ============================================================
   START
   ============================================================ */

renderFilters();

render();

</script>

</body>

</html>
