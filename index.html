
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
VORT3X — Gaming Platform
</title>


<style>


/* ============================================================
   ROOT
   ============================================================ */

:root {

    --bg:#050712;

    --panel:#0b1020;

    --panel2:#11182d;

    --text:#eef4ff;

    --muted:#8e9bb8;

    --cyan:#36e7ff;

    --purple:#9b5cff;

    --pink:#ff4fd8;

    --green:#5cff9d;

    --border:
        rgba(112,151,255,.18);

}


/* ============================================================
   RESET
   ============================================================ */

* {

    box-sizing:border-box;

}


html,
body {

    margin:0;

    min-height:100%;

}


/* ============================================================
   BODY
   ============================================================ */

body {

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(54,231,255,.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 0%,
            rgba(155,92,255,.16),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #040610,
            #080b18 55%,
            #050711
        );

    color:
        var(--text);

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    min-height:100vh;

}


/* ============================================================
   GAME MODE
   ============================================================ */

body.game-open {

    overflow:hidden !important;

}


body.game-open header,
body.game-open main,
body.game-open footer {

    display:none !important;

}


/* ============================================================
   HEADER
   ============================================================ */

header {

    position:sticky;

    top:0;

    z-index:20;

    backdrop-filter:
        blur(18px);

    background:
        rgba(5,7,18,.78);

    border-bottom:
        1px solid var(--border);

}


.nav {

    max-width:1400px;

    margin:auto;

    padding:
        18px 24px;

    display:flex;

    gap:24px;

    align-items:center;

}


.logo {

    font-weight:900;

    letter-spacing:2px;

    font-size:20px;

    white-space:nowrap;

}


.logo span {

    color:var(--cyan);

    text-shadow:
        0 0 18px var(--cyan);

}


/* ============================================================
   SEARCH
   ============================================================ */

.search {

    flex:1;

    position:relative;

}


.search input {

    width:100%;

    padding:
        13px
        17px
        13px
        42px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:#0a0f1e;

    color:white;

    outline:none;

    font-size:15px;

}


.search::before {

    content:"⌕";

    position:absolute;

    left:15px;

    top:8px;

    font-size:24px;

    color:var(--muted);

}


/* ============================================================
   BUTTONS
   ============================================================ */

.btn {

    border:
        1px solid
        rgba(54,231,255,.35);

    background:
        rgba(54,231,255,.08);

    color:white;

    padding:
        11px 16px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

}


.btn:hover {

    background:
        rgba(54,231,255,.17);

}


/* ============================================================
   MAIN
   ============================================================ */

main {

    max-width:1400px;

    margin:auto;

    padding:
        34px 24px 70px;

}


.section-head {

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin:
        42px 0 18px;

}


.section-head h2 {

    margin:0;

    font-size:26px;

}


.count {

    color:var(--muted);

    font-size:13px;

}


/* ============================================================
   FILTERS
   ============================================================ */

.filters {

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:20px;

}


.filter {

    border:
        1px solid var(--border);

    background:transparent;

    color:var(--muted);

    padding:
        8px 12px;

    border-radius:999px;

    cursor:pointer;

}


.filter.active,
.filter:hover {

    color:white;

    border-color:
        rgba(54,231,255,.45);

    background:
        rgba(54,231,255,.08);

}


/* ============================================================
   GRID
   ============================================================ */

.grid {

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

}


/* ============================================================
   CARD
   ============================================================ */

.card {

    background:

        linear-gradient(
            150deg,
            rgba(17,24,45,.94),
            rgba(8,11,24,.96)
        );

    border:
        1px solid var(--border);

    border-radius:19px;

    overflow:hidden;

    transition:.2s;

    cursor:pointer;

}


.card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(54,231,255,.42);

    box-shadow:

        0 16px 40px
        rgba(0,0,0,.3),

        0 0 25px
        rgba(54,231,255,.07);

}


/* ============================================================
   THUMB
   ============================================================ */

.thumb {

    height:150px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(54,231,255,.18),
            transparent 42%
        ),

        #080c1b;

}


/* ============================================================
   INFO
   ============================================================ */

.info {

    padding:15px;

}


.title {

    font-weight:800;

}


.meta {

    display:flex;

    justify-content:space-between;

    margin-top:9px;

    color:var(--muted);

    font-size:12px;

}


.tag {

    color:var(--cyan);

}


/* ============================================================
   EMPTY
   ============================================================ */

.empty {

    text-align:center;

    color:var(--muted);

    padding:60px;

    display:none;

}


/* ============================================================
   FOOTER
   ============================================================ */

footer {

    text-align:center;

    color:#64718d;

    padding:30px;

    border-top:
        1px solid var(--border);

    font-size:13px;

}


/* ============================================================
   GAME MODAL
   ============================================================ */

.modal {

    position:fixed;

    inset:0;

    background:#000;

    display:none;

    z-index:999999;

    width:100vw;

    height:100vh;

}


.modal.show {

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ============================================================
   GAME BOX
   ============================================================ */

.gamebox {

    width:100vw;

    height:100vh;

    background:#000;

    overflow:hidden;

    position:relative;

}


/* ============================================================
   CONTROLS
   ============================================================ */

.game-controls {

    position:fixed;

    top:16px;

    right:16px;

    z-index:1000000;

    display:flex;

    gap:10px;

}


.ctrl-btn {

    width:44px;

    height:44px;

    border-radius:12px;

    border:
        1px solid
        rgba(54,231,255,.4);

    background:
        rgba(5,7,18,.75);

    backdrop-filter:
        blur(10px);

    color:white;

    font-size:20px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

}


.ctrl-btn:hover {

    background:
        rgba(54,231,255,.22);

}


/* ============================================================
   GAME AREA
   ============================================================ */

.gamearea {

    width:100vw;

    height:100vh;

    position:relative;

    overflow:hidden;

    background:#000;

}


/* ============================================================
   IFRAME
   ============================================================ */

.gamearea iframe {

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    border:none;

    display:block;

    background:#000;

}


/* ============================================================
   PLAY SCREEN
   ============================================================ */

.play-screen {

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:14px;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(54,231,255,.13),
            transparent 35%
        ),

        #050712;

    text-align:center;

    z-index:10;

}


.play-icon {

    font-size:80px;

}


.play-screen h2 {

    margin:0;

    font-size:34px;

}


.play-screen p {

    margin:0 0 12px;

    color:var(--muted);

}


.play-screen button {

    border:
        1px solid
        rgba(54,231,255,.55);

    background:
        rgba(54,231,255,.10);

    color:white;

    padding:
        14px 30px;

    border-radius:13px;

    cursor:pointer;

    font-size:16px;

    font-weight:800;

}


@media(max-width:1050px) {

    .grid {

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:760px) {

    .grid {

        grid-template-columns:
            repeat(2,1fr);

    }

    .nav {

        flex-wrap:wrap;

    }

    .search {

        order:3;

        flex-basis:100%;

    }

}


@media(max-width:480px) {

    .grid {

        grid-template-columns:1fr;

    }

    main {

        padding:
            20px 14px;

    }

}

</style>

</head>

tion", "https://911games.io/pac-man"], ["Car Parking Multiplayer", "🅿️", "Action", "https://911games.io/car-parking-multiplayer"], ["Ragdoll", "🤸", "Action", "https://911games.io/ragdoll"], ["Zombs Royale", "🧟", "Action", "https://911games.io/zombs-royale"], ["Football Legends", "⚽", "Sports", "https://911games.io/football-legends-2"], ["A Small World Cup", "⚽", "Sports", "https://911games.io/a-small-world-cup"], ["Head Soccer", "⚽", "Sports", "https://911games.io/head-soccer"], ["Penalty Kick Online", "⚽", "Sports", "https://911games.io/penalty-kick-online"], ["Soccer Legends 2021", "⚽", "Sports", "https://911games.io/soccer-legends-2021"], ["Boxing Random", "🥊", "Sports", "https://911games.io/boxing-random"], ["Tennis Masters", "🎾", "Sports", "https://911games.io/tennis-masters"], ["Ping Pong", "🏓", "Sports", "https://911games.io/ping-pong"], ["Basket Champs", "🏀", "Sports", "https://911games.io/basket-champs"], ["4th and Goal 2022", "🏈", "Sports", "https://911games.io/4th-and-goal-2022"], ["Volleyball Challenge", "🏐", "Sports", "https://911games.io/volleyball-challenge"], ["LoLBeans", "🫘", "Adventure", "https://911games.io/lolbeans"], ["Terraria", "⛏️", "Adventure", "https://911games.io/terraria"], ["Forge Of Empires", "🏰", "Adventure", "https://911games.io/forge-of-empires"], ["Narrow One", "🎯", "Adventure", "https://911games.io/narrow-one"], ["Escape Room 2", "🚪", "Adventure", "https://911games.io/escape-room-2"], ["MooMoo", "🪓", "Adventure", "https://911games.io/moomoo"], ["Checkers", "⚫", "Board", "https://911games.io/checkers"], ["Yahtzee", "🎲", "Board", "https://911games.io/yahtzee"], ["Backgammon", "🎲", "Board", "https://911games.io/backgammon"], ["Uno", "🎴", "Board", "https://911games.io/uno"], ["Master Chess Multiplayer", "♟️", "Board", "https://911games.io/master-chess-multiplayer"], ["Papa's Freezeria", "🍦", "Simulation", "https://911games.io/papas-freezeria"], ["Papa's Burgeria", "🍔", "Simulation", "https://911games.io/papas-burgeria"], ["Papa's Cupca let active = "ALL";

let currentGame = null;


/* ============================================================
   FILTERS
   ============================================================ */

function renderFilters() {

    const cats = [

        "ALL",

        ...new Set(
            games.map(
                g => g[2]
            )
        )

    ];


    const filters =
        document.getElementById(
            "filters"
        );


    filters.innerHTML =
        cats.map(
            category => `

                <button
                    class="filter ${
                        category === active
                        ? "active"
                        : ""
                    }"

                    onclick="setCategory('${category}')"
                >

                    ${category}

                </button>

            `
        ).join("");

}


function setCategory(category) {

    active = category;

    renderFilters();

    render();

}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const shown =
        games.filter(
            game =>

                (
                    active === "ALL"
                    ||
                    game[2] === active
                )

                &&

                game[0]
                    .toLowerCase()
                    .includes(search)
        );


    document
        .getElementById("count")
        .textContent =
        `${shown.length} / ${games.length} GAMES`;


    document
        .getElementById("empty")
        .style.display =
        shown.length
        ? "none"
        : "block";


    document
        .getElementById("grid")
        .innerHTML =

        shown.map(

            game => `

                <article
                    class="card"
                    onclick='openGame(${JSON.stringify(game)})'
                >

                    <div class="thumb">

                        ${game[1]}

                    </div>


                    <div class="info">

                        <div class="title">

                            ${game[0]}

                        </div>


                        <div class="meta">

                            <span class="tag">

                                ${game[2]}

                            </span>

                        </div>

                    </div>

                </article>

            `

        ).join("");

}


/* ============================================================
   LOAD GAME
   ============================================================ */

function loadCurrentGame() {

    if (!currentGame) {

        return;

    }


    const gamearea =
        document.getElementById(
            "gamearea"
        );


    const url =
        currentGame[3];


    if (!url) {

        gamearea.innerHTML = `

            <div class="play-screen">

                <div class="play-icon">
                    🚧
                </div>

                <h2>
                    Game Unavailable
                </h2>

                <p>
                    No playable frame was found.
                </p>

            </div>

        `;

        return;

    }


    gamearea.innerHTML = "";


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src = url;


    iframe.title =
        currentGame[0];


    iframe.setAttribute(
        "allow",
        "fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    );


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    iframe.setAttribute(
        "webkitallowfullscreen",
        ""
    );


    iframe.setAttribute(
        "mozallowfullscreen",
        ""
    );


    iframe.style.position =
        "absolute";


    iframe.style.inset =
        "0";


    iframe.style.width =
        "100%";


    iframe.style.height =
        "100%";


    iframe.style.border =
        "none";


    iframe.style.display =
        "block";


    iframe.style.background =
        "#000";


    gamearea.appendChild(
        iframe
    );

}


/* ============================================================
   OPEN GAME
   ============================================================ */

function openGame(game) {

    currentGame = game;


    document.body.classList.add(
        "game-open"
    );


    document
        .getElementById("modal")
        .classList.add("show");


    loadCurrentGame();

}


/* ============================================================
   CLOSE GAME
   ============================================================ */

function closeGameSession() {

    if (document.fullscreenElement) {

        document
            .exitFullscreen()
            .catch(
                () => {}
            );

    }


    document.body.classList.remove(
        "game-open"
    );


    document
        .getElementById("modal")
        .classList.remove(
            "show"
        );


    document
        .getElementById("gamearea")
        .innerHTML = `

            <div class="play-screen">

                <div class="play-icon">
                    🎮
                </div>

                <h2>
                    Game Ready
                </h2>

                <p>
                    Select a game to begin.
                </p>

            </div>

        `;


    currentGame = null;

}


/* ============================================================
   FULLSCREEN
   ============================================================ */

async function toggleFullscreen() {

    const gamebox =
        document.querySelector(
            ".gamebox"
        );


    try {

        if (!document.fullscreenElement) {

            await gamebox.requestFullscreen();

        }

        else {

            await document.exitFullscreen();

        }

    }

    catch (error) {

        console.log(
            "Fullscreen unavailable:",
            error
        );

    }

}


/* ============================================================
   FULLSCREEN ICON
   ============================================================ */

document.addEventListener(
    "fullscreenchange",
    () => {

        const button =
            document.getElementById(
                "fullscreenBtn"
            );


        if (!button) {

            return;

        }


        button.textContent =
            document.fullscreenElement
            ? "⛝"
            : "⛶";

    }
);


/* ============================================================
   ESCAPE
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (event.key !== "Escape") {

            return;

        }


        if (document.fullscreenElement) {

            document
                .exitFullscreen()
                .catch(
                    () => {}
                );

            return;

        }


        if (currentGame) {

            closeGameSession();

        }

    }
);


/* ============================================================
   RANDOM
   ============================================================ */

function randomGame() {

    if (!games.length) {

        return;

    }


    const game =
        games[
            Math.floor(
                Math.random()
                *
                games.length
            )
        ];


    openGame(game);

}


/* ============================================================
   SEARCH
   ============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* ============================================================
   START
   ============================================================ */

renderFilters();

render();


</script>

</body>

</html>
